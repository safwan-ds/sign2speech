# Sign Language Glove Default Configuration
# This file contains default settings. Override via:
# 1. Environment variables (.env file)
# 2. config.py programmatic constants
# 3. Runtime arguments

hardware:
  serial:
    port: COM9
    baud_rate: 115200
    timeout: 1
    connection_delay: 2

  sensors:
    flex_count: 5
    imu_axes: 6
    total_channels: 11

training:
  model:
    type: advanced
    lstm_units: 64
    lstm_layers: 2
    dropout_rate: 0.4
    use_bidirectional: true
    use_attention: true
    use_batch_norm: true

  hyperparameters:
    batch_size: 32
    epochs: 150
    learning_rate: 0.0005
    sequence_length: 30
    weight_decay: 0.0005

  augmentation:
    enabled: true
    factor: 2
    probability: 0.7
    techniques:
      - time_warping
      - magnitude_warping
      - noise_injection
      - scaling
      - time_shifting
      - rotation

  regularization:
    use_weighted_loss: true
    use_label_smoothing: true
    label_smoothing_factor: 0.1
    gradient_clip_value: 1.0

inference:
  motion_detection:
    enabled: true
    threshold: 0.02
    min_duration: 5
    smoothing_window: 3

  prediction:
    min_confidence: 0.70
    consensus_frames: 2
    confidence_gap_threshold: 0.20
    min_consecutive_rest: 5

llm:
  qwen:
    enabled: true
    model_filename: qwen2.5-3b-instruct-q4_k_m.gguf
    n_ctx: 512
    n_gpu_layers: -1
    max_tokens: 32
    temperature: 0.1

gui:
  window:
    min_width: 900
    min_height: 600
    padding: 20

  font:
    size: 12
    title_size: 14
