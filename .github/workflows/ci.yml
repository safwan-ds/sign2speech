name: Python Checks

on:
  push:
  pull_request:

jobs:
  test-and-compile:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint with ruff
        run: ruff check --exit-zero .

      - name: Run tests
        run: python -m pytest -q

      - name: Compile all source files (syntax check)
        run: python -m compileall -q .
