name: Python Checks

on:
  push:
  pull_request:

jobs:
  test-and-compile:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --extra optimization

      - name: Lint with ruff
        run: uv run ruff check --exit-zero .

      - name: Run tests
        run: uv run pytest -q

      - name: Compile all source files (syntax check)
        run: uv run python -m compileall -q config core gui scripts tests utils
