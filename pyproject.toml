[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sign-lang-glove"
version = "0.1.0"
description = "Sign Language Glove - Gesture recognition with LSTM"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "torch",
    "matplotlib",
    "seaborn",
    "pyserial",
    "keyboard",
    "PySide6",
    "llama-cpp-python",
    "edge-tts",
]

[project.optional-dependencies]
dev = ["pytest", "torchviz"]

[project.scripts]
sign-glove-gui = "gui.main:main"
sign-glove-train = "scripts.train_model:main"
sign-glove-predict = "scripts.predict:main"
sign-glove-process = "scripts.process_data:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "gui*", "scripts*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
