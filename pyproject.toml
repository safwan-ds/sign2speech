[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sign-lang-glove"
version = "0.1.0"
description = "Sign2Speech - Real-time gesture recognition with LSTM and attention"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "torch",
    "matplotlib",
    "seaborn",
    "pyserial",
    "keyboard",
    "PySide6",
    "QT-PyQt-PySide-Custom-Widgets",
    "llama-cpp-python",
    "edge-tts",
    "pyttsx3",
]

[project.optional-dependencies]
dev = ["pytest", "torchviz"]

[project.scripts]
sign-glove-gui = "main:main"
sign-glove-manager = "data_manager_gui:main"
sign-glove-train = "scripts.train_model:main"
sign-glove-predict = "scripts.predict:main"
sign-glove-process = "scripts.process_data:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "gui*", "scripts*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
