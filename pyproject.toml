[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sign2speech"
version = "0.2.0"
description = "Sign2Speech - Real-time gesture recognition with LSTM and attention"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4,<3",
    "pandas>=3.0,<4",
    "scipy>=1.17,<2",
    "scikit-learn>=1.8,<2",
    "torch==2.11.0",
    "torchvision>=0.16,<1",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13,<1",
    "pyserial>=3.5,<4",
    "keyboard>=0.13,<1",
    "PySide6>=6.11,<7",
    "QT-PyQt-PySide-Custom-Widgets>=2.1,<3",
    "llama-cpp-python>=0.3,<0.4",
    "edge-tts>=7.2,<8",
    "pyttsx3>=2.99,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "torchviz"]

[project.scripts]
sign-glove-gui = "main:main"
sign-glove-manager = "data_manager_gui:main"
sign-glove-train = "scripts.train_model:main"
sign-glove-predict = "scripts.predict:main"
sign-glove-process = "scripts.process_data:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "gui*", "scripts*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
